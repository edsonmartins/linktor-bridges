<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" font-family="Inter, Manrope, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <!-- Background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="1" stop-color="#07111F"/>
    </linearGradient>

    <!-- Card fills -->
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1526"/>
      <stop offset="1" stop-color="#0D1B31"/>
    </linearGradient>
    <linearGradient id="cardFillFocal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C1930"/>
      <stop offset="1" stop-color="#0F2140"/>
    </linearGradient>
    <linearGradient id="subFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101E36"/>
      <stop offset="1" stop-color="#0E1A2F"/>
    </linearGradient>
    <linearGradient id="waFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C2A1C"/>
      <stop offset="1" stop-color="#0A2419"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38A8FF"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#65E572"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A855F7"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/>
    </marker>
    <marker id="arrMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6E8C"/>
    </marker>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect width="1240" height="900" fill="url(#bgGrad)"/>
  <!-- subtle grid -->
  <g stroke="#0E1B30" stroke-width="1" opacity="0.6">
    <line x1="0" y1="120" x2="1240" y2="120"/>
    <line x1="0" y1="200" x2="1240" y2="200"/>
    <line x1="0" y1="300" x2="1240" y2="300"/>
    <line x1="0" y1="400" x2="1240" y2="400"/>
    <line x1="0" y1="500" x2="1240" y2="500"/>
    <line x1="0" y1="600" x2="1240" y2="600"/>
    <line x1="0" y1="700" x2="1240" y2="700"/>
  </g>

  <!-- ============ TITLE ============ -->
  <text x="620" y="46" text-anchor="middle" fill="#F2F7FF" font-size="30" font-weight="800" letter-spacing="1">LINKTOR ⟷ WHATSAPP BRIDGE</text>
  <text x="620" y="74" text-anchor="middle" fill="#8CA3C3" font-size="14" letter-spacing="0.4">Arquitetura de mensageria e chamada de voz — sessão WhatsApp hospedada no device do usuário</text>

  <!-- legend -->
  <g font-size="10.5" fill="#8CA3C3">
    <circle cx="60" cy="100" r="5" fill="#38A8FF"/><text x="72" y="104">mensagens (dados)</text>
    <circle cx="180" cy="100" r="5" fill="#A855F7"/><text x="192" y="104">voz / sinalização</text>
    <circle cx="305" cy="100" r="5" fill="#F59E0B"/><text x="317" y="104">mídia de voz (PCM) / futuro</text>
    <circle cx="470" cy="100" r="5" fill="#65E572"/><text x="482" y="104">health / ack</text>
    <circle cx="590" cy="100" r="5" fill="#EF4444"/><text x="602" y="104">rejeição / bloqueio</text>
  </g>

  <!-- ============ LEFT: LINKTOR PLATFORM ============ -->
  <g>
    <rect x="40" y="140" width="340" height="575" rx="16" fill="url(#cardFill)" stroke="#22365C" stroke-width="1.2"/>
    <rect x="40" y="140" width="340" height="50" rx="16" fill="#0D1A2E"/>
    <text x="60" y="172" fill="#E6EDF7" font-size="15" font-weight="700">Linktor Platform</text>
    <text x="60" y="190" fill="#5A6E8C" font-size="10.5">servidor · monólito modular · multi-tenant</text>

    <!-- Gateway Hub -->
    <rect x="56" y="205" width="308" height="58" rx="10" fill="url(#subFill)" stroke="#38A8FF" stroke-width="1.1" filter="url(#glowSoft)"/>
    <text x="72" y="227" fill="#38A8FF" font-size="12.5" font-weight="700">Gateway Hub</text>
    <text x="72" y="243" fill="#8CA3C3" font-size="10">WS /api/v1/gateways/ws · token por canal</text>
    <text x="72" y="256" fill="#5A6E8C" font-size="10">Hub · Bridge · health (ping/pong)</text>

    <!-- RemoteAdapter -->
    <rect x="56" y="272" width="308" height="58" rx="10" fill="url(#subFill)" stroke="#38A8FF" stroke-width="1.1"/>
    <text x="72" y="294" fill="#38A8FF" font-size="12.5" font-weight="700">RemoteAdapter</text>
    <text x="72" y="310" fill="#8CA3C3" font-size="10">plugin.ChannelAdapter por canal</text>
    <text x="72" y="323" fill="#5A6E8C" font-size="10">outbound.Worker resolve → bridge</text>

    <!-- Outbound Worker -->
    <rect x="56" y="339" width="308" height="58" rx="10" fill="url(#subFill)" stroke="#1E3A5F" stroke-width="1.1"/>
    <text x="72" y="361" fill="#E6EDF7" font-size="12.5" font-weight="700">Outbound Worker</text>
    <text x="72" y="377" fill="#8CA3C3" font-size="10">NATS · retry · DLQ · rate-limit</text>
    <text x="72" y="390" fill="#5A6E8C" font-size="10">fila unificada de envio</text>

    <!-- Inbound Pipeline -->
    <rect x="56" y="406" width="308" height="58" rx="10" fill="url(#subFill)" stroke="#1E3A5F" stroke-width="1.1"/>
    <text x="72" y="428" fill="#E6EDF7" font-size="12.5" font-weight="700">Inbound Pipeline</text>
    <text x="72" y="444" fill="#8CA3C3" font-size="10">NATS linktor.messages.inbound.&gt;</text>
    <text x="72" y="457" fill="#5A6E8C" font-size="10">receiveMessageUC · rehost de mídia</text>

    <!-- Inbox · Bots · IA -->
    <rect x="56" y="473" width="308" height="58" rx="10" fill="url(#subFill)" stroke="#A855F7" stroke-width="1.1" filter="url(#glowSoft)"/>
    <text x="72" y="495" fill="#A855F7" font-size="12.5" font-weight="700">Inbox · Bots · IA</text>
    <text x="72" y="511" fill="#8CA3C3" font-size="10">conversas · respostas automáticas</text>
    <text x="72" y="524" fill="#5A6E8C" font-size="10">agentes humanos · escalação</text>

    <!-- Call Handler -->
    <rect x="56" y="540" width="308" height="58" rx="10" fill="url(#subFill)" stroke="#A855F7" stroke-width="1.1"/>
    <text x="72" y="562" fill="#A855F7" font-size="12.5" font-weight="700">Call Handler</text>
    <text x="72" y="578" fill="#8CA3C3" font-size="10">call_event / call_command</text>
    <text x="72" y="591" fill="#5A6E8C" font-size="10">Place/Accept/Reject/End (futuro PCM)</text>

    <!-- Health strip -->
    <rect x="56" y="613" width="308" height="34" rx="9" fill="#0D1A2E" stroke="#1E3A5F" stroke-width="1"/>
    <text x="72" y="634" fill="#65E572" font-size="10.5">bridge_health inline · online / stale · last_seen</text>
  </g>

  <!-- ============ CENTER: BRIDGE (FOCAL) ============ -->
  <g>
    <rect x="452" y="140" width="336" height="575" rx="18" fill="url(#cardFillFocal)" stroke="#38A8FF" stroke-width="1.6" filter="url(#glow)"/>
    <rect x="452" y="140" width="336" height="50" rx="18" fill="#0F2info2544" opacity="0"/>
    <text x="474" y="172" fill="#FFFFFF" font-size="16" font-weight="800">BRIDGE · no device do usuário</text>
    <text x="474" y="190" fill="#5A6E8C" font-size="10.5">Android · Windows · Linux · macOS</text>

    <!-- whatsmeow Client -->
    <rect x="468" y="205" width="304" height="64" rx="10" fill="url(#subFill)" stroke="#65E572" stroke-width="1.3" filter="url(#glowSoft)"/>
    <text x="484" y="227" fill="#65E572" font-size="12.5" font-weight="700">whatsmeow Client</text>
    <text x="484" y="243" fill="#8CA3C3" font-size="10">sessão WhatsApp Web / Multi-Device</text>
    <text x="484" y="256" fill="#5A6E8C" font-size="10">websocket + sinalização (dono da sessão)</text>

    <!-- Voice Engine -->
    <rect x="468" y="278" width="304" height="64" rx="10" fill="url(#subFill)" stroke="#A855F7" stroke-width="1.2"/>
    <text x="484" y="300" fill="#A855F7" font-size="12.5" font-weight="700">Voice Engine</text>
    <text x="484" y="316" fill="#8CA3C3" font-size="10">CallManager · codec mlow (pure-Go)</text>
    <text x="484" y="329" fill="#5A6E8C" font-size="10">relay SCTP/SRTP da chamada</text>

    <!-- Session Store -->
    <rect x="468" y="351" width="304" height="58" rx="10" fill="url(#subFill)" stroke="#F59E0B" stroke-width="1.1"/>
    <text x="484" y="373" fill="#F59E0B" font-size="12.5" font-weight="700">Session Store · SQLite</text>
    <text x="484" y="389" fill="#8CA3C3" font-size="10">identidade + chaves (armazenamento privado)</text>

    <!-- Event Store -->
    <rect x="468" y="418" width="304" height="58" rx="10" fill="url(#subFill)" stroke="#F59E0B" stroke-width="1.1"/>
    <text x="484" y="440" fill="#F59E0B" font-size="12.5" font-weight="700">Event Store · SQLite</text>
    <text x="484" y="456" fill="#8CA3C3" font-size="10">fila durável de inbound p/ o gateway</text>

    <!-- Pairing UI -->
    <rect x="468" y="485" width="304" height="58" rx="10" fill="url(#subFill)" stroke="#38A8FF" stroke-width="1.1"/>
    <text x="484" y="507" fill="#38A8FF" font-size="12.5" font-weight="700">Pairing UI</text>
    <text x="484" y="523" fill="#8CA3C3" font-size="10">QR Code · código de pareamento</text>

    <!-- Agent -->
    <rect x="468" y="552" width="304" height="58" rx="10" fill="url(#subFill)" stroke="#E6EDF7" stroke-width="1.1"/>
    <text x="484" y="574" fill="#E6EDF7" font-size="12.5" font-weight="700">Agent (protocolo bridge)</text>
    <text x="484" y="590" fill="#8CA3C3" font-size="10">hello · outbound/ack · ping/pong</text>
    <text x="484" y="603" fill="#5A6E8C" font-size="10">reconexão com backoff</text>

    <!-- Health -->
    <rect x="468" y="625" width="304" height="28" rx="9" fill="#0D1A2E" stroke="#1E3A5F" stroke-width="1"/>
    <text x="484" y="644" fill="#65E572" font-size="10">tray + notificação nativa ao desconectar</text>
  </g>

  <!-- ============ RIGHT: WHATSAPP (external) ============ -->
  <g>
    <!-- subtle 3D offset for external system -->
    <rect x="858" y="148" width="344" height="200" rx="16" fill="#081120"/>
    <rect x="852" y="140" width="344" height="200" rx="16" fill="url(#waFill)" stroke="#2C9B57" stroke-width="1.4" filter="url(#glowSoft)"/>
    <text x="872" y="170" fill="#65E572" font-size="16" font-weight="800">WHATSAPP</text>
    <text x="872" y="188" fill="#7FBF92" font-size="10.5">externo · Multi-Device · Web</text>
    <rect x="868" y="200" width="312" height="44" rx="9" fill="#0C2A1C" stroke="#2C9B57" stroke-width="1"/>
    <text x="884" y="219" fill="#B8E6C6" font-size="11">WebSocket · sinalização</text>
    <text x="884" y="233" fill="#6FA380" font-size="10">offer/accept/terminate/reject</text>
    <rect x="868" y="252" width="312" height="44" rx="9" fill="#0C2A1C" stroke="#2C9B57" stroke-width="1"/>
    <text x="884" y="271" fill="#B8E6C6" font-size="11">Relay SCTP/UDP · mídia</text>
    <text x="884" y="285" fill="#6FA380" font-size="10">RTP/SRTP da chamada de voz</text>

    <!-- Secondary external cards -->
    <rect x="852" y="365" width="344" height="150" rx="16" fill="url(#cardFill)" stroke="#22365C" stroke-width="1.2"/>
    <text x="872" y="392" fill="#8CA3C3" font-size="11" font-weight="700">REDE / LOCALIZAÇÃO</text>
    <text x="872" y="412" fill="#5A6E8C" font-size="10">Sessão nasce no mesmo IP onde o WhatsApp</text>
    <text x="872" y="426" fill="#5A6E8C" font-size="10">Web já é usado → sem anomalia de geo/ban</text>
    <text x="872" y="446" fill="#EF4444" font-size="10.5">⚠ protocolo não-oficial (risco operacional)</text>
    <text x="872" y="462" fill="#EF4444" font-size="10.5">⚠ use contas/números de teste</text>

    <!-- Linktor out -->
    <rect x="852" y="540" width="344" height="120" rx="16" fill="url(#cardFill)" stroke="#22365C" stroke-width="1.2"/>
    <text x="872" y="566" fill="#8CA3C3" font-size="11" font-weight="700">SAÍDA PARA OUTROS CANAIS</text>
    <text x="872" y="586" fill="#5A6E8C" font-size="10">Cloud API · Telegram · SMS · Email · RCS</text>
    <text x="872" y="600" fill="#5A6E8C" font-size="10">mesmo Outbound Worker unificado</text>
    <text x="872" y="630" fill="#8CA3C3" font-size="10.5">A bridge é só mais um canal no Linktor</text>
  </g>

  <!-- ============ ARROWS / FLOWS ============ -->
  <!-- 1 · OUTBOUND: Linktor → Bridge → WhatsApp -->
  <path d="M 380 300 C 416 300, 420 237, 468 237" fill="none" stroke="#38A8FF" stroke-width="2" marker-end="url(#arrBlue)"/>
  <circle cx="398" cy="272" r="11" fill="#38A8FF"/>
  <text x="398" y="276" text-anchor="middle" fill="#030712" font-size="11" font-weight="800">1</text>
  <text x="392" y="253" fill="#38A8FF" font-size="10">outbound (comando)</text>

  <path d="M 772 237 L 816 237 L 816 232 L 852 232" fill="none" stroke="#38A8FF" stroke-width="2" marker-end="url(#arrBlue)"/>
  <circle cx="812" cy="237" r="11" fill="#38A8FF"/>
  <text x="812" y="241" text-anchor="middle" fill="#030712" font-size="11" font-weight="800">2</text>
  <text x="778" y="222" fill="#38A8FF" font-size="10">whatsmeow.SendMessage</text>

  <!-- 3 · INBOUND: WhatsApp → Bridge → Linktor -->
  <path d="M 852 345 C 820 345, 810 410, 772 410" fill="none" stroke="#38A8FF" stroke-width="2" marker-end="url(#arrBlue)"/>
  <circle cx="822" cy="372" r="11" fill="#38A8FF"/>
  <text x="822" y="376" text-anchor="middle" fill="#030712" font-size="11" font-weight="800">3</text>
  <text x="826" y="357" fill="#38A8FF" font-size="10">mensagem recebida</text>

  <path d="M 452 447 L 380 447" fill="none" stroke="#38A8FF" stroke-width="2" marker-end="url(#arrBlue)"/>
  <circle cx="416" cy="447" r="11" fill="#38A8FF"/>
  <text x="416" y="451" text-anchor="middle" fill="#030712" font-size="11" font-weight="800">4</text>
  <text x="382" y="428" fill="#38A8FF" font-size="10">inbound (event store → gateway)</text>

  <!-- 5 · VOICE SIGNALING IN: WhatsApp → Bridge Voice Engine -->
  <path d="M 852 190 C 760 190, 690 210, 650 210 L 620 210 L 590 278" fill="none" stroke="#A855F7" stroke-width="2" marker-end="url(#arrPurple)"/>
  <circle cx="706" cy="205" r="11" fill="#A855F7"/>
  <text x="706" y="209" text-anchor="middle" fill="#030712" font-size="11" font-weight="800">5</text>
  <text x="700" cy="188" fill="#A855F7" font-size="10">call offer (sinalização)</text>

  <!-- 6 · VOICE EVENT TO LINKTOR -->
  <path d="M 468 310 C 420 310, 410 560, 364 569" fill="none" stroke="#A855F7" stroke-width="2" marker-end="url(#arrPurple)"/>
  <circle cx="414" cy="424" r="11" fill="#A855F7"/>
  <text x="414" y="428" text-anchor="middle" fill="#030712" font-size="11" font-weight="800">6</text>
  <text x="374" y="506" fill="#A855F7" font-size="10">call_event (incoming/state/ended)</text>

  <!-- 7 · VOICE COMMAND TO BRIDGE -->
  <path d="M 364 569 C 400 560, 408 352, 468 342" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrRed)"/>
  <circle cx="406" cy="458" r="11" fill="#EF4444"/>
  <text x="406" y="462" text-anchor="middle" fill="#030712" font-size="11" font-weight="800">7</text>
  <text x="322" y="600" fill="#EF4444" font-size="10">call_command (reject) · call_ack</text>

  <!-- 8 · VOICE MEDIA PCM (future, dashed) -->
  <path d="M 468 310 C 420 310, 410 476, 364 476" fill="none" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrOrange)"/>
  <circle cx="416" cy="476" r="11" fill="none" stroke="#F59E0B" stroke-width="1.6"/>
  <text x="416" y="480" text-anchor="middle" fill="#F59E0B" font-size="11" font-weight="800">8</text>
  <text x="382" y="460" fill="#F59E0B" font-size="10">call_pcm · PCM 16k (futuro)</text>

  <!-- 9 · HEALTH -->
  <path d="M 452 636 C 420 636, 410 634, 364 630" fill="none" stroke="#65E572" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <circle cx="408" cy="635" r="11" fill="#65E572"/>
  <text x="408" y="639" text-anchor="middle" fill="#030712" font-size="11" font-weight="800">9</text>
  <text x="386" y="620" fill="#65E572" font-size="10">ping/pong · status · health</text>

  <!-- 10 · ACK success -->
  <path d="M 452 246 C 420 246, 410 300, 380 300" fill="none" stroke="#65E572" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <circle cx="416" cy="274" r="11" fill="#65E572"/>
  <text x="416" y="278" text-anchor="middle" fill="#030712" font-size="11" font-weight="800">10</text>
  <text x="392" y="300" fill="#65E572" font-size="10">ack · message_id</text>

  <!-- ============ BOTTOM PRINCIPLES BAR ============ -->
  <g>
    <rect x="40" y="760" width="1160" height="84" rx="16" fill="url(#cardFill)" stroke="#22365C" stroke-width="1.2"/>
    <text x="60" y="786" fill="#8CA3C3" font-size="11" font-weight="700" letter-spacing="0.6">PRINCÍPIOS</text>

    <g text-anchor="middle">
      <text x="220" y="810" fill="#65E572" font-size="12" font-weight="700">Sessão Local</text>
      <text x="220" y="826" fill="#5A6E8C" font-size="10">whatsmeow no device</text>
      <line x1="340" y1="792" x2="340" y2="828" stroke="#1E3A5F"/>

      <text x="470" y="810" fill="#38A8FF" font-size="12" font-weight="700">Entrega Durável</text>
      <text x="470" y="826" fill="#5A6E8C" font-size="10">event store SQLite + ack</text>
      <line x1="590" y1="792" x2="590" y2="828" stroke="#1E3A5F"/>

      <text x="720" y="810" fill="#65E572" font-size="12" font-weight="700">Health Monitorada</text>
      <text x="720" y="826" fill="#5A6E8C" font-size="10">ping/pong · online/stale</text>
      <line x1="840" y1="792" x2="840" y2="828" stroke="#1E3A5F"/>

      <text x="970" y="810" fill="#38A8FF" font-size="12" font-weight="700">Reconexão Automática</text>
      <text x="970" y="826" fill="#5A6E8C" font-size="10">backoff + retry de fila</text>
      <line x1="1090" y1="792" x2="1090" y2="828" stroke="#1E3A5F"/>

      <text x="1180" y="810" fill="#A855F7" font-size="12" font-weight="700">Extensível</text>
      <text x="1180" y="826" fill="#5A6E8C" font-size="10">bridge = 1 canal do Linktor</text>
    </g>
  </g>
</svg>
